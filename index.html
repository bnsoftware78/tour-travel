/* ================= PREMIUM THEME ================= */
:root{--serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans',Inter,system-ui,sans-serif;--gold2:#f0cf8a;--shadow:0 1px 2px #0d3a2e0a,0 12px 32px -12px #0d3a2e26;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.17'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>");--pat2:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.10'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>")}
body{font-family:var(--sans);background:#f3f6f4;background-image:var(--pat2);background-size:64px;background-attachment:fixed;-webkit-font-smoothing:antialiased}
.welcome h1,.panelhead h2,.statval,.goalamount,.box h3,.brand strong{font-family:var(--serif)!important;font-weight:700}
.welcome h1{font-size:34px;letter-spacing:-.2px}.panelhead h2{font-size:22px}
.card{border:1px solid #e3ebe7;border-radius:18px;background:#fff}
/* sidebar */
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--deep),color-mix(in srgb,var(--deep) 82%,#000));background-image:var(--pat),linear-gradient(180deg,var(--deep),color-mix(in srgb,var(--deep) 82%,#000));background-size:64px,auto;position:sticky;border-right:1px solid #ffffff10}
.sidebar:after{content:"";position:absolute;inset:0;pointer-events:none}
.brandmark{background:linear-gradient(145deg,#ffffff26,#ffffff0a);border:1px solid #ffffff2a;overflow:hidden}
.brand strong{font-size:21px;letter-spacing:.3px}.brand small{color:var(--gold2);opacity:.85}
.navlabel{color:var(--gold2);opacity:.6}
.nav a{position:relative;font-weight:500;transition:.2s}.nav a.active{background:linear-gradient(90deg,#ffffff22,#ffffff08);color:#fff}
.nav a.active:before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(#f0cf8a,#d9a84e)}
.nav a.active .ico{color:var(--gold2)}
.sidebottom{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:11px 12px;margin:0 2px}
.avatar{background:linear-gradient(145deg,#f0cf8a,#d9a84e);box-shadow:0 0 0 3px #ffffff1c}
/* topbar */
.topbar{position:sticky;top:0;z-index:20;background:#ffffffd9;backdrop-filter:blur(12px);height:68px}
.branch{border-radius:99px;background:#f3f8f5}
.content{padding:30px 40px 56px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px 38px;margin-bottom:20px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;background:linear-gradient(120deg,var(--green) 0%,var(--deep) 100%);box-shadow:0 22px 44px -22px var(--deep)}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:80px;opacity:1;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 85%);mask-image:linear-gradient(100deg,transparent 10%,#000 85%)}
.hero:after{content:"";position:absolute;right:-110px;top:-130px;width:360px;height:360px;border-radius:50%;border:1px solid #f0cf8a40;box-shadow:0 0 0 38px #f0cf8a0c,0 0 0 76px #f0cf8a08}
.hero>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2);font-weight:600}
.eyebrow:before{content:"";width:22px;height:1px;background:var(--gold2)}
.hero h1{font:700 38px/1.1 var(--serif);margin:12px 0 8px;color:#fff}
.hero p{margin:0;color:#c3dcd3;font-size:13px;max-width:520px;line-height:1.6}
.hero .hdate{margin-top:14px;display:inline-block;font-size:12px;color:#e3f0eb;background:#ffffff14;border:1px solid #ffffff22;padding:6px 13px;border-radius:99px}
.hero .hbtn{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.gold{border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:12.5px;color:#3a2a08;background:linear-gradient(135deg,#f6dc9c,#d9a84e);box-shadow:0 8px 18px -8px #d9a84e}
.gold:hover{filter:brightness(1.05)}
.ghost{border:1px solid #ffffff38;border-radius:11px;padding:12px 18px;font-weight:600;font-size:12.5px;color:#fff;background:#ffffff12}
.ghost:hover{background:#ffffff22}
.ring{position:relative;width:158px;height:158px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .rv{text-align:center}.ring .rv b{display:block;font:700 34px var(--serif)}.ring .rv small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#bcd6cc}
/* stats */
.stats{gap:18px;margin-bottom:20px}
.stat{padding:20px 22px;overflow:hidden;min-height:136px;transition:.25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px #0d3a2e40}
.stat:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.stat:after{content:"";position:absolute;right:-26px;bottom:-26px;width:100px;height:100px;background-image:var(--pat);filter:invert(1) hue-rotate(180deg);opacity:.55;background-size:50px}
.staticon{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--mint),#fff);border:1px solid #d7e8e0;color:var(--green)}
.statval{font-size:32px!important;margin:16px 0 4px}
/* chart */
.bars{height:210px;gap:14px}.bar{background:linear-gradient(180deg,#e7bd71,var(--green));border-radius:9px 9px 3px 3px;max-width:50px;transition:.3s}
.bc:hover .bar{filter:brightness(1.15)}.bc:last-child .bar{background:linear-gradient(180deg,#f0cf8a,#d9a84e)}
.bc{color:#6a7f77;font-weight:500}
/* goal */
.goal{background:linear-gradient(145deg,var(--green),var(--deep))!important;box-shadow:0 22px 40px -22px var(--deep)}
.goal>*{position:relative;z-index:1}
.goal .gpat{position:absolute;inset:0;background-image:var(--pat);background-size:70px;z-index:0;opacity:.9;-webkit-mask-image:linear-gradient(200deg,#000,transparent 60%);mask-image:linear-gradient(200deg,#000,transparent 60%)}
.progress span{background:linear-gradient(90deg,#f0cf8a,#d9a84e)}
/* lower grid */
.lower{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr);gap:18px}
.pk{padding:13px 0;border-bottom:1px dashed #e1e9e5}.pk:last-child{border:0}
.pk .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pk b{font-size:13px}.pk small{color:var(--muted);font-size:11px}
.pk .bar2{height:7px}.pk .bar2 span{background:linear-gradient(90deg,var(--green),var(--gold))}
.alert{display:flex;gap:12px;align-items:center;padding:13px 15px;border-radius:13px;background:#fff7e6;border:1px solid #f1dcae;color:#7d5a14;font-size:12px;margin-bottom:16px}
.alert button{margin-left:auto}
.promo{margin-bottom:20px}
.banner{border-radius:18px;border:1px solid #e3ebe7;margin-bottom:20px}
/* tables & forms */
tbody tr{transition:.15s}tbody tr:hover{background:#f6faf8}
th{background:#f7faf8}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
.pad{border-radius:18px}
.primary{background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 8px 18px -8px var(--green)}
.secondary{border-radius:10px}.secondary:hover{background:#f3f8f5}
.welcome{padding-bottom:16px;border-bottom:1px solid #e3ebe7;position:relative}
.welcome:after{content:"";position:absolute;left:0;bottom:-1px;width:70px;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.box{border-radius:20px;box-shadow:0 30px 60px -20px #000a}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--green) 40%,transparent);border-color:var(--green)}
/* login */
#lg{background:linear-gradient(135deg,#0d5b4c,#062e28)!important;background-image:var(--pat),linear-gradient(135deg,#0d5b4c,#062e28)!important;background-size:80px,auto!important}
#lg .box{border-top:4px solid var(--gold);max-width:400px}
@media(max-width:1050px){.hero{padding:28px}.lower{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{height:100vh}.nav a.active:before{left:-8px}.content{padding:20px 14px 48px}.hero{grid-template-columns:1fr;padding:24px 20px}.hero h1{font-size:30px}.ring{display:none}.statval{font-size:25px!important}.sidebottom{padding:8px 0;background:none;border:0}}

.status.late{background:#fdecea;color:#b3261e}.status.late:before{background:#c0392b}
.sisa{font-weight:700;color:#a8631a}.sisa.ok{color:#2f8a67}.pct{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.mini .stat{min-height:98px;padding:16px 18px}.mini .statval{font-size:25px!important;margin:10px 0 2px}
@media(max-width:1050px){.mini{grid-template-columns:repeat(2,1fr)}}
.pad{scroll-margin-top:84px}
.dfoto{width:96px;height:128px;border-radius:12px;background:var(--mint);overflow:hidden;display:grid;place-items:center;color:var(--green);font:700 30px var(--serif);flex:none}.dfoto img{width:100%;height:100%;object-fit:cover}
.drow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #e1e9e5;font-size:12px}.drow small{color:var(--muted);flex:none}.drow span{text-align:right;font-weight:600;word-break:break-word}
.box .actions{flex-wrap:wrap;margin-top:14px}
td.no{color:var(--muted);font-size:11px;font-weight:600;width:1%;text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}

let D={s:{biro:'',tag:'',logo:'',admin:'',peran:'',warna:'#0d5b4c',target:0,tahun:2027},p:[],j:[],t:[]},cur='home',q='',LERR='',IS_OWNER=false;

paket(){return head('Paket Wisata','Atur paket dan harga yang ditawarkan','<button class="primary" data-act="addP">＋ Tambah paket</button>')+`<div class="card pad">${tbl(['Foto','Paket','Harga','Berangkat','Kuota','Terisi',''],D.p.map(p=>`<tr><td>${p.foto?`<img class="pimg" src="${esc(p.foto)}" alt="">`:'<span class="note">-</span>'}</td><td><b>${esc(p.n)}</b></td><td class="amount">${rp(p.harga)}</td><td>${esc(fb(p.ber))}</td><td>${p.kuota}</td><td>${D.j.filter(j=>j.paket==p.id).length}</td><td><button class="linkbtn" data-act="editP" data-id="${p.id}">Ubah</button> <button class="linkbtn" data-act="dupP" data-id="${p.id}">Duplikat</button> <button class="linkbtn" data-act="tglP" data-id="${p.id}">Atur tanggal</button> <button class="linkbtn" data-act="fotoP" data-id="${p.id}">${p.foto?'Ganti foto':'Tambah foto'}</button> <button class="linkbtn danger" data-act="delP" data-id="${p.id}">Hapus</button></td></tr>`).join(''))}</div>`},
penjual(){return head('Panel Penjual','Kelola travel yang memakai aplikasi Anda')+'<div id="pj"><div class="empty">Memuat…</div></div>'},
laporan(){const rows=D.p.map(p=>{const js=D.j.filter(j=>j.paket==p.id),tg=js.reduce((a,j)=>a+(j.harga??p.harga),0),tr=js.reduce((a,j)=>a+paid(j.id),0);return `<tr><td><b>${esc(p.n)}</b></td><td>${js.length}</td><td class="amount">${rp(tg)}</td><td class="amount">${rp(tr)}</td><td class="amount">${rp(Math.max(0,tg-tr))}</td></tr>`}).join('');

set(){const s=D.s,F=[['biro','Nama travel'],['tag','Tagline'],['logo','Logo (1–2 huruf/emoji)'],['admin','Nama admin'],['peran','Jabatan'],['wa','No. WhatsApp'],['alamat','Alamat'],['rek','Rekening pembayaran'],['target','Target dana (Rp)','number'],['tahun','Tahun keberangkatan','number'],['warna','Warna utama','color'],['kode','Kode nomor peserta (3 huruf)']];

function jrows(){const k=q.toLowerCase(),l=D.j.filter(j=>(j.n+j.id).toLowerCase().includes(k));return tbl(['Peserta','HP','Paket','Terkumpul','Sisa','Progres',''],l.map(j=>{const p=P(j.paket),pd=paid(j.id),hg=p?(j.harga??p.harga):0,pc=p?Math.min(100,pd/hg*100):0;return `<tr><td><div class="person"><span class="miniava">${esc(ini(j.n))}</span><span><b>${esc(j.n)}</b><small>${esc(j.id)}</small></span></div></td><td>${esc(j.hp)}</td><td>${esc(p?.n||'-')}</td><td class="amount">${rp(pd)}</td><td>${p?rp(Math.max(0,hg-pd)):'-'}</td><td><div class="bar2"><span style="width:${pc}%"></span></div></td><td><button class="linkbtn" data-act="link" data-id="${j.id}">Tautan</button> <button class="linkbtn" data-act="addT" data-id="${j.id}">Setor</button> <button class="linkbtn danger" data-act="delJ" data-id="${j.id}">Hapus</button></td></tr>`}).join(''))}

function form(title,fs,cb){$('#mo').innerHTML=`<div class="box"><h3>${title}</h3><form id="f">${fs.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t=='number'?'min="0" step="any" required':''} ${f.r?'required':''} ${f.a?`accept="${f.a}"`:''}>`}</label>`).join('')}<div class="actions"><button type="button" class="secondary" data-act="close">Batal</button><button class="primary">Simpan</button></div></form></div>`;$('#mo').classList.add('on');$('#f').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));A.close()}}
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));a.download=name;a.click()};

fotoP:id=>form('Foto paket',[{k:'foto',l:'Pilih foto (JPG/PNG)',t:'file',a:'image/*',r:1}],v=>{(async()=>{if(!v.foto||!v.foto.size)return;const old=P(id)?.foto,u=await upImg(v.foto,1000,'paket');if(!u)return;await run(SB.from('paket').update({foto:u}).eq('id',id));settle(u,old)})()}),
ok:id=>run(SB.from('setoran').update({st:'ok'}).eq('id',id)),

csv:k=>{const r=k=='j'?[['ID','Nama','HP','Paket','Terkumpul'],...D.j.map(j=>[j.id,j.n,j.hp,P(j.paket)?.n||'',paid(j.id)])]:[['Tanggal','ID Peserta','Nama','Metode','Nominal','Status'],...D.t.map(x=>[x.tgl,x.j,J(x.j)?.n||'',x.m,x.v,x.st])];dl(k=='j'?'peserta.csv':'setoran.csv',r.map(a=>a.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv')},

const SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function all(t,o){let out=[];for(let i=0;;i+=1000){const{data,error}=await SB.from(t).select('*').order(o).order('id').range(i,i+999);if(error)return{error};out=out.concat(data);if(data.length<1000)return{data:out}}}
async function load(){LERR='';try{try{IS_OWNER=(await SB.rpc('is_owner')).data===true}catch(x){IS_OWNER=false}if(IS_OWNER){D={s:{biro:'Super Admin',tag:'PENJUAL',logo:'★',admin:'Penjual',peran:'Super admin',warna:'#0d5b4c',target:0,tahun:2027},p:[],j:[],t:[]};cur='penjual';render();return true}const r=await Promise.all([SB.from('biro').select('*').single(),all('paket','created_at'),all('peserta','id'),all('setoran','tgl')]);const e=r.find(x=>x.error);if(e){LERR=e.error.code=='PGRST116'?'Akun Anda belum aktif: menunggu verifikasi admin, atau masa langganan sudah berakhir. Silakan hubungi admin.':e.error.message;msg(LERR);return false}D={s:r[0].data,p:r[1].data,j:r[2].data.filter(x=>x.aktif!==false).map(x=>({...x,paket:x.paket||''})),t:r[3].data};render();return true}catch(x){LERR='Gagal memuat data: '+(x.message||x);msg(LERR);return false}}
let LAST_OK=false;
async function run(q){const r=await q;LAST_OK=!r.error;if(r.error){msg(r.error.code=='42501'?'Akses ditolak: hanya admin yang boleh melakukan ini':r.error.message);return false}return load()}
A.saveS=async()=>{const o={};['biro','tag','logo','admin','peran','wa','alamat','rek','target','tahun','warna','kode'].forEach(k=>{const v=$('#s_'+k).value;o[k]=['target','tahun'].includes(k)?+v||0:v});const oldLogo=D.s.logo,ok=await run(SB.from('biro').update(o).eq('id',D.s.id));if(LAST_OK&&/^https?:/.test(oldLogo||'')&&o.logo!==oldLogo)dropImg(oldLogo);if(ok)msg('Pengaturan disimpan')};

/* ===== Gambar: banner & foto paket (Supabase Storage) ===== */
function shrink(file,maxW){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses gambar')),'image/jpeg',.85)};img.onerror=()=>rej(new Error('File bukan gambar yang valid (pakai JPG atau PNG)'));img.src=u})}
async function upImg(file,maxW,pre){try{const b=await shrink(file,maxW),p=D.s.id+'/'+pre+'-'+Date.now()+'.jpg',r=await SB.storage.from('biro-media').upload(p,b,{contentType:'image/jpeg'});if(r.error){msg(r.error.message);return null}return SB.storage.from('biro-media').getPublicUrl(p).data.publicUrl}catch(x){msg(x.message||'Gagal mengunggah gambar');return null}}
const dropImg=u=>{const p=imgPath(u);if(p)SB.storage.from('biro-media').remove([p])},settle=(nu,old)=>dropImg(LAST_OK?old:nu);
const imgPath=u=>{const i=String(u||'').indexOf('/biro-media/');return i<0?null:decodeURIComponent(u.slice(i+12))};
A.upBanner=async()=>{const f=$('#bn_file').files[0];if(!f)return msg('Pilih gambar dulu');const old=D.s.banner,u=await upImg(f,1600,'banner');if(!u)return;const ok=await run(SB.from('biro').update({banner:u}).eq('id',D.s.id));settle(u,old);if(ok)msg('Banner disimpan')};
A.delBanner=async()=>{if(!D.s.banner||!confirm('Hapus banner?'))return;const old=D.s.banner;if(await run(SB.from('biro').update({banner:null}).eq('id',D.s.id))){const p=imgPath(old);if(p)SB.storage.from('biro-media').remove([p])}};
A.upLogo=async()=>{const f=$('#lg_file').files[0];if(!f)return msg('Pilih gambar dulu');const old=D.s.logo,u=await upImg(f,400,'logo');if(!u)return;const ok=await run(SB.from('biro').update({logo:u}).eq('id',D.s.id));settle(u,old);if(ok)msg('Logo disimpan')};
A.delLogo=async()=>{const old=D.s.logo;if(!confirm('Hapus logo gambar?'))return;if(await run(SB.from('biro').update({logo:''}).eq('id',D.s.id))){const p=imgPath(old);if(p)SB.storage.from('biro-media').remove([p])}};

const th=qp.get('token_hash'),tp=qp.get('type');if(th&&(tp=='signup'||tp=='recovery'||tp=='email'))return showVerify(th,tp=='email'?'signup':tp);

return{manual,target,coll,pc:target>0?Math.min(100,coll/target*100):0,kurang:Math.max(0,target-coll),n:manual?D.j.length:L.length}}

/* ===== Sisa pembayaran per peserta ===== */
let SORT='';
const tglOk=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
function jinfo(j){const p=P(j.paket),hg=p?(j.harga??p.harga):0,pd=paid(j.id),sisa=Math.max(0,hg-pd),pc=hg?Math.min(100,pd/hg*100):0,today=new Date();today.setHours(0,0,0,0);
const dep=p&&tglOk(p.ber)?new Date(p.ber+'T00:00'):null,dLeft=dep?Math.round((dep-today)/864e5):null,mLeft=dep?Math.max(0,(dep.getFullYear()-today.getFullYear())*12+dep.getMonth()-today.getMonth()):null,
need=dep&&sisa>0?(mLeft>0?Math.ceil(sisa/mLeft/1000)*1000:sisa):null;
let st=['Belum pilih paket','pending'];if(p){if(hg>0&&sisa==0)st=['Lunas',''];else if(dLeft!==null&&dLeft<0)st=['Terlewat','late'];else if(dLeft!==null&&dLeft<=60)st=['Segera lunasi','late'];else st=['Menabung','pending']}
return{p,hg,pd,sisa,pc,dep,dLeft,mLeft,need,st}}
const hl=i=>i.dep?(i.dLeft<0?'sudah lewat':'H-'+i.dLeft):'';
const urg=i=>i.sisa==0&&i.p?1e9:i.dLeft==null?1e8:i.dLeft;
jrows=function(){const k=q.toLowerCase();let l=D.j.filter(j=>(j.n+j.id+(j.hp||'')+(j.nik||'')).toLowerCase().includes(k)).map(j=>{const i=jinfo(j);i.done=isDone(i);if(i.done)i.st=['Sudah berangkat',''];return{j,i}}).filter(x=>perOk(x));
if(SORT=='sisa')l.sort((a,b)=>b.i.sisa-a.i.sisa);else if(SORT=='mendesak')l.sort((a,b)=>urg(a.i)-urg(b.i));
const pg=pager('peserta',l.length);return tbl(['No','Peserta','Paket / berangkat','Terkumpul','Sisa','Perlu / bulan','Progres','Status',''],nr(l.slice(pg.s,pg.e).map(({j,i})=>`<tr><td><div class="person"><span class="miniava">${esc(ini(j.n))}</span><span><b>${esc(j.n)}</b><small>${esc(j.id)}${j.hp?' · '+esc(j.hp):''}</small></span></div></td>
<td>${esc(i.p?.n||'-')}<small style="display:block;color:#8a9a94;font-size:10px;margin-top:3px">${i.dep?fd(iso(i.dep))+' · '+hl(i):esc(i.p?.ber||'')}</small></td>
<td class="amount">${rp(i.pd)}</td><td class="sisa ${i.p&&i.sisa==0?'ok':''}">${i.p?(i.sisa>0?rp(i.sisa):'Lunas'):'-'}</td><td>${i.need!=null?rp(i.need):'-'}</td>
<td><div class="bar2"><span style="width:${i.pc}%"></span></div><span class="pct">${i.pc.toFixed(0)}%</span></td><td><span class="status ${i.st[1]}">${i.st[0]}</span></td>
<td><button class="linkbtn" data-act="detJ" data-id="${j.id}">Detail</button> ${i.p&&i.sisa>0?(bisaPindah(i)?`<button class="linkbtn" data-act="pindah" data-id="${j.id}">Pindah periode</button> `:`<button class="linkbtn" disabled title="Tersedia setelah tanggal keberangkatan terlewat">Pindah periode</button> `):''}<button class="linkbtn" data-act="addT" data-id="${j.id}">Setor</button> <button class="linkbtn" data-act="link" data-id="${j.id}">Tautan</button> ${i.sisa>0?`<button class="linkbtn" data-act="ingat" data-id="${j.id}">Ingatkan</button> `:''}<button class="linkbtn danger" data-act="delJ" data-id="${j.id}">Hapus</button></td></tr>`),pg.s))+pg.html};
V.peserta=function(){const L=D.j.map(jinfo),sis=L.reduce((a,i)=>a+i.sisa,0),lunas=L.filter(i=>i.p&&i.hg>0&&i.sisa==0).length,mep=L.filter(i=>i.sisa>0&&i.dLeft!==null&&i.dLeft<=60).length,rata=L.length?L.reduce((a,i)=>a+i.pc,0)/L.length:0;
const c=(a,v,f)=>`<article class="card stat"><div class="stathead">${a}</div><div class="statval">${v}</div><div class="statfoot">${f}</div></article>`;

<div class="card pad"><div class="tools"><input id="q" placeholder="Cari nama / nomor…" value="${esc(q)}" oninput="q=this.value;PG.peserta=1;$('#jt').innerHTML=jrows()"><select style="max-width:210px;margin:0" onchange="SORT=this.value;PG.peserta=1;$('#jt').innerHTML=jrows()"><option value="">Urutan: terdaftar</option><option value="mendesak" ${SORT=='mendesak'?'selected':''}>Paling mendesak</option><option value="sisa" ${SORT=='sisa'?'selected':''}>Sisa terbesar</option></select></div><div id="jt">${jrows()}</div></div>`};

A.ingat=id=>{const j=J(id);if(!j)return;const i=jinfo(j),u=new URL('peserta.html',location.href);u.searchParams.set('t',j.token);

/* ===== Paginasi (Data Peserta, Tabungan, Laporan) ===== */
let PS=15;try{PS=+localStorage.getItem('wisata_ps')||15}catch(e){}
if(![10,15,25,50,100].includes(PS))PS=15;
const PG={peserta:1,setoran:1,laporan:1};
/* sisipkan kolom nomor urut (lanjut antarhalaman) di awal tiap baris */
const nr=(a,s)=>a.map((h,i)=>h.replace(/^<tr([^>]*)>/,`<tr$1><td class="no">${s+i+1}</td>`)).join('');
function pager(key,total){const pages=Math.max(1,Math.ceil(total/PS));let p=Math.min(Math.max(1,PG[key]||1),pages);PG[key]=p;
const s=(p-1)*PS,e=Math.min(total,p*PS);if(!total)return{s:0,e:0,html:''};
const nums=[];for(let i=1;i<=pages;i++){if(i==1||i==pages||Math.abs(i-p)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…')}
const b=(n,lb,dis,on)=>`<button type="button" class="pgb ${on?'on':''}" ${dis?'disabled':'data-act="pg" data-id="'+key+'|'+n+'"'}>${lb}</button>`;
const ctrl=pages>1?`<div class="pn">${b(p-1,'‹ Sebelumnya',p==1)}${nums.map(n=>n==='…'?'<span class="dots">…</span>':b(n,n,false,n==p)).join('')}${b(p+1,'Berikutnya ›',p==pages)}</div>`:'<div></div>';
return{s,e,html:`<div class="pager"><span>Menampilkan <b>${s+1}–${e}</b> dari <b>${total}</b> data<select onchange="A.ps(this.value)">${[10,15,25,50,100].map(n=>`<option value="${n}" ${n==PS?'selected':''}>${n} / halaman</option>`).join('')}</select></span>${ctrl}</div>`}}
let SQ='',SSt='';

const loadJs=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('Gagal memuat pustaka Excel. Periksa koneksi internet.'));document.head.appendChild(s)});
A.xlsx=async()=>{try{msg('Menyiapkan laporan Excel…');

const out=await buildXlsx(window.ExcelJS,window.JSZip,R),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='laporan-wisata-'+iso(now)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg('Laporan Excel diunduh');

A.resetTok=id=>{if(!confirm('Tautan lama peserta ini akan berhenti berfungsi. Lanjutkan?'))return;const t=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');run(SB.from('peserta').update({token:t}).eq('id',id)).then(o=>{if(o){A.close();msg('Tautan lama dinonaktifkan. Kirim tautan baru lewat tombol Tautan.')}})};
const sat=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
const tb=n=>n<12?sat[n]:n<20?tb(n-10)+' belas':n<100?tb(Math.floor(n/10))+' puluh'+(n%10?' '+tb(n%10):''):n<200?'seratus'+(n%100?' '+tb(n%100):''):n<1000?tb(Math.floor(n/100))+' ratus'+(n%100?' '+tb(n%100):''):n<2000?'seribu'+(n%1000?' '+tb(n%1000):''):n<1e6?tb(Math.floor(n/1e3))+' ribu'+(n%1e3?' '+tb(n%1e3):''):n<1e9?tb(Math.floor(n/1e6))+' juta'+(n%1e6?' '+tb(n%1e6):''):tb(Math.floor(n/1e9))+' miliar'+(n%1e9?' '+tb(n%1e9):'');
A.kwi=id=>{const x=D.t.find(t=>String(t.id)==String(id));if(!x)return;const j=J(x.j),s=D.s,p=j&&P(j.paket),v=Math.round(x.v),w=/^#[0-9a-f]{6}$/i.test(s.warna||'')?s.warna:'#0d5b4c',no='KW-'+String(x.tgl).replace(/-/g,'')+'-'+String(x.id).replace(/-/g,'').slice(-5).toUpperCase(),win=window.open('','_blank');if(!win)return msg('Izinkan pop-up untuk mencetak kwitansi');
win.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Kwitansi ${esc(no)}</title><style>@page{size:A5 landscape;margin:10mm}body{font:13px Arial,sans-serif;color:#18332e;margin:0;padding:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.k{border:2px solid ${w};border-radius:10px;padding:18px 22px}.h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid ${w};padding-bottom:10px;margin-bottom:12px}.h b{font-size:17px;color:${w}}.h small{display:block;color:#70827d;margin-top:3px}.t{font-size:20px;font-weight:800;letter-spacing:3px;color:${w};text-align:right}.r{display:flex;padding:5px 0}.r span{width:150px;color:#70827d}.r b{flex:1}.n{display:inline-block;margin-top:12px;border:2px solid ${w};border-radius:8px;padding:8px 16px;font-size:19px;font-weight:800}.s{float:right;text-align:center;margin-top:8px;width:200px}.s i{display:block;height:54px}.bar{text-align:center;margin-bottom:10px}@media print{.bar{display:none}}</style></head><body><div class="bar"><button onclick="print()">Cetak</button></div><div class="k"><div class="h"><div><b>${esc(s.biro)}</b><small>${esc(s.alamat||'')}${s.wa?' · WA '+esc(s.wa):''}</small></div><div><div class="t">KWITANSI</div><small style="text-align:right">No. ${esc(no)}</small></div></div>
<div class="r"><span>Telah terima dari</span><b>${esc(j?.n||'-')} (${esc(x.j)})</b></div><div class="r"><span>Uang sejumlah</span><b><i>${esc(tb(v).replace(/^./,c=>c.toUpperCase()))} rupiah</i></b></div><div class="r"><span>Untuk pembayaran</span><b>Tabungan wisata${p?' · '+esc(p.n):''}</b></div><div class="r"><span>Metode · Tanggal</span><b>${esc(x.m)} · ${fd(x.tgl)}</b></div>
<div class="n">${rp(v)}</div><div class="s">${esc(s.biro)}<i></i><b>${esc(s.admin)}</b><br><small>${esc(s.peran||'')}</small></div><div style="clear:both"></div></div><script>window.onload=()=>setTimeout(()=>print(),400)<\/script></body></html>`);win.document.close()};

A.thumbAll=async()=>{const L=D.j.filter(j=>j.foto&&!j.foto_mini);if(!L.length){alert('Tidak ada peserta yang perlu dibuatkan thumbnail.\n\nPeserta dengan foto: '+D.j.filter(j=>j.foto).length+'\nSudah punya thumbnail: '+D.j.filter(j=>j.foto_mini).length);return}let ok=0,log=[];for(let i=0;i<L.length;i++){msg('Memproses '+(i+1)+' dari '+L.length+'…');const n=L[i].n;try{const u=await SB.storage.from('peserta-foto').createSignedUrl(L[i].foto,120);if(u.error)throw new Error('ambil foto: '+u.error.message);const res=await fetch(u.data.signedUrl);if(!res.ok)throw new Error('unduh foto gagal (HTTP '+res.status+')');const m=await toDataUrl(await cropPhoto(await res.blob(),150,200));const r=await SB.from('peserta').update({foto_mini:m}).eq('id',L[i].id).select('id,foto_mini');if(r.error)throw new Error('simpan: '+r.error.message+(r.error.code?' ['+r.error.code+']':''));if(!r.data||!r.data.length)throw new Error('database menolak tanpa error (0 baris berubah, kemungkinan izin/RLS)');if(!r.data[0].foto_mini)throw new Error('tersimpan tetapi kolom tetap kosong');ok++;log.push('✓ '+n+' ('+Math.round(m.length/1024)+' KB)')}catch(x){log.push('✗ '+n+': '+(x.message||x))}}await load();alert('Hasil pembuatan thumbnail:\n\n'+log.join('\n'))};
