<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Tabungan Wisata Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0d5b4c;--deep:#083d35;--gold:#d9a84e;--gold2:#f0cf8a;--mint:#e8f4ef;--ink:#18332e;--muted:#70827d;--line:#e3ebe7;--serif:'Cormorant Garamond',Georgia,serif;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.17'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>")}
*{box-sizing:border-box}body{margin:0;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:#f3f6f4;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}.wrap{max-width:720px;margin:auto;padding:0 16px 60px}
.top{display:flex;align-items:center;gap:11px;padding:16px 0}.logo{width:40px;height:40px;border-radius:13px;background:var(--green);color:var(--gold2);display:grid;place-items:center;font-size:20px;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:cover}
.top b{font:700 20px var(--serif);display:block}.top small{font-size:10px;letter-spacing:1.3px;color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 22px;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 22px 44px -22px var(--deep);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:80px;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 90%);mask-image:linear-gradient(100deg,transparent 10%,#000 90%)}
.hero>*{position:relative}.eb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);font-weight:600}
.hero h1{font:700 30px/1.1 var(--serif);margin:8px 0 6px}.hero p{margin:0;color:#c3dcd3;font-size:12.5px;line-height:1.55}
.chip{display:inline-block;margin-top:12px;font-size:11px;background:#ffffff16;border:1px solid #ffffff2a;border-radius:99px;padding:5px 11px;color:#e6f2ee}
.stp{display:inline-block;margin:12px 0 0 8px;transform:rotate(-5deg);border:2px double currentColor;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:1.5px;background:#ffffffee}.stp.l{color:#1b7a4a}.stp.n{color:#c0392b}
.ring{position:relative;width:132px;height:132px;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:700 32px var(--serif);display:block;text-align:center}.ring small{display:block;text-align:center;font-size:9px;letter-spacing:1px;color:#bcd6cc;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 12px 30px -16px #0d3a2e30}
.card h2{font:700 22px var(--serif);margin:0 0 4px}.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px;position:relative;overflow:hidden}
.k:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--gold))}
.k small{display:block;font-size:10.5px;color:var(--muted)}.k b{display:block;font:700 21px var(--serif);margin-top:6px;color:#183c32}
/* perjalanan */
.track{position:relative;display:flex;justify-content:space-between;padding:6px 6px 0;margin:8px 0 4px}
.track:before{content:"";position:absolute;left:22px;right:22px;top:21px;height:4px;border-radius:4px;background:#e3ebe7}
.fill{position:absolute;left:22px;top:21px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--gold))}
.st{position:relative;width:52px;text-align:center;font-size:10px;color:var(--muted)}.st i{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 7px;border-radius:50%;background:#fff;border:3px solid #dbe6e1;font-style:normal;font-size:14px}
.st.on{color:var(--green);font-weight:600}.st.on i{border-color:var(--gold);background:var(--gold2)}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:10px;color:#6a7f77}
.bar{width:100%;max-width:42px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#e7bd71,var(--green));min-height:3px}.bc:last-child .bar{background:linear-gradient(180deg,var(--gold2),var(--gold))}.bc i{font-style:normal}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed #e1e9e5;align-items:center}.tl li:last-child{border:0}
.tl .d{width:38px;height:38px;border-radius:12px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none}
.tl b{display:block;font-size:13px}.tl small{color:var(--muted);font-size:11px}.tl .r{margin-left:auto;text-align:right}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:10px;background:#eaf5ed;color:#37805b;margin-top:4px}.tag.p{background:#fff5e4;color:#a87521}
.rek{display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.5;white-space:pre-line}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:12px}input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus{outline:2px solid #0d5b4c55;border-color:var(--green)}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 10px 20px -10px var(--green)}
.btn:disabled{opacity:.6}.sec{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:12px;color:#46645a;white-space:nowrap;margin-left:auto}
.wa{display:block;text-align:center;text-decoration:none;color:var(--green);font-weight:600;font-size:12.5px;margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:22px 10px}.err{background:#fdecea;color:#b3261e;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}.ok{background:#eaf5ed;color:#2c7a55;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
@media(max-width:520px){.hero{grid-template-columns:1fr}.ring{margin:auto;order:-1}.hero h1{font-size:26px}.k b{font-size:17px}.st{width:46px;font-size:9px}}

.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font-size:12px;font-weight:600;color:#46645a;white-space:nowrap}.tab.on{background:var(--green);border-color:var(--green);color:#fff}
input[type=range]{padding:0;border:0;margin:12px 0 4px;accent-color:var(--green);background:none}
.ctl{background:#f6faf8;border-radius:14px;padding:14px 15px;margin-bottom:14px}.ctl .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}.ctl .lb b{font:700 24px var(--serif);color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum div{background:var(--mint);border-radius:13px;padding:11px 10px}.sum small{display:block;font-size:10px;color:var(--muted)}.sum b{display:block;font:700 18px var(--serif);margin-top:4px}
.warn{background:#fff5e4;color:#8a5d10;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;margin-bottom:12px}.good{background:#eaf5ed;color:#2c7a55;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;margin-bottom:12px}
.cv{width:100%;height:auto;display:block}.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin:6px 0 14px}.lg i{display:inline-block;width:14px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.saldo{background:linear-gradient(135deg,var(--green),var(--deep));color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden}.saldo:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:70px;opacity:.9}.saldo>*{position:relative}.saldo small{font-size:11px;color:#bcd6cc}.saldo b{display:block;font:700 30px var(--serif);margin-top:2px}
.bk{width:100%;border-collapse:collapse;font-size:12px}.bk th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#81928b;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}.bk td{padding:10px 6px;border-bottom:1px dashed #e1e9e5}.bk td.n{text-align:right;font-weight:700;color:#245846}.bk th:nth-child(n+3){text-align:right}.bk small{display:block;color:var(--muted);font-size:10px}.tablewrap{overflow:auto}

.due{margin-top:14px;border-radius:18px;padding:16px 18px;background:#fff;border:1px solid #f1dcae;border-left:5px solid var(--gold);display:grid;grid-template-columns:1fr 1.5fr;gap:16px;align-items:center;box-shadow:0 12px 30px -16px #0d3a2e30}
.due.hot{background:#fff7e6;border-color:#e9b44c}.due small{display:block;font-size:10.5px;color:var(--muted)}.due b{display:block;font:700 24px var(--serif);margin-top:2px;color:#183c32}.due em{display:block;font-style:normal;font-size:11px;color:#a87521;margin-top:2px;font-weight:600}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dr b{font-size:19px}
@media(max-width:520px){.due{grid-template-columns:1fr}.due b{font-size:22px}}
.pid{display:flex;gap:14px;align-items:center}
.pf{width:84px;height:112px;border-radius:16px;border:2px solid var(--gold2);background:#ffffff1c;overflow:hidden;display:grid;place-items:center;flex:none;box-shadow:0 10px 22px -10px #0007}
.pf img{width:100%;height:100%;object-fit:cover;display:block}
.pf svg{width:62%;opacity:.85}
.pid h1{margin:6px 0 0}
@media(max-width:520px){.pf{width:72px;height:96px}}

/* ===== MOBILE ===== */
html{-webkit-text-size-adjust:100%}
@media(max-width:520px){
.wrap{padding:0 12px calc(40px + env(safe-area-inset-bottom))}
input,select{font-size:16px}
.hero{padding:20px 16px;border-radius:20px;gap:12px}
.hero h1{font-size:24px}.hero p{font-size:12px}
.ring{width:112px;height:112px}.ring svg{width:112px;height:112px}.ring b{font-size:28px}
.pid{gap:12px}
.stp{margin:10px 0 0 6px}
.grid3{gap:8px}.k{padding:12px 10px}.k b{font-size:15px!important}
.card{padding:16px 14px;border-radius:18px}.card h2{font-size:20px}
.sum{gap:6px}.sum div{padding:9px 8px}.sum b{font-size:15px}
.due{padding:14px}.dr{gap:8px}.dr b{font-size:16px}
#f>div[style*="grid-template-columns"]{grid-template-columns:1fr!important}
.btn{padding:15px}.sec{padding:10px 14px}.tab{padding:10px 14px}
.bk{font-size:11.5px}
}
@media(max-width:360px){.grid3{grid-template-columns:1fr 1fr}.grid3 .k:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Memuat…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),TK=new URLSearchParams(location.search).get('t')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const sh=n=>n>=1e9?'Rp '+(n/1e9).toFixed(2).replace('.',',')+' M':n>=1e6?'Rp '+(n/1e6).toFixed(1).replace('.',',')+' jt':rp(n);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const dark=(h,f)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(c=>Math.round(c*f).toString(16).padStart(2,'0')).join('')};
const wal=n=>{let d=String(n||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
const fb=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?fd(d):(d||'');
const METODE=['Transfer bank','Virtual account','Setor tunai','QRIS'];
let DATA=null;
function shrink(file,maxW){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses gambar')),'image/jpeg',.82)};img.onerror=()=>rej(new Error('File harus berupa gambar (JPG/PNG)'));img.src=u})}
async function load(){
  if(!TK){$('#app').innerHTML='<div class="center">Tautan tidak lengkap. Mintalah tautan pribadi Anda kepada admin travel.</div>';return}
  const r=await SB.rpc('peserta_lihat',{p_token:TK});
  if(r.error&&/fetch|network|failed/i.test(r.error.message||'')){$('#app').innerHTML='<div class="center">Koneksi bermasalah. Periksa internet Anda lalu muat ulang halaman.</div>';return}
  if(r.error||!r.data){$('#app').innerHTML='<div class="center">Tautan tidak valid atau sudah tidak aktif.<br>Silakan hubungi admin travel Anda.</div>';return}
  DATA=r.data;try{const f=await SB.rpc('peserta_foto',{p_token:TK});DATA.foto_mini=f.error?'':(f.data||'')}catch(e){DATA.foto_mini=''}draw()}
function draw(){
  const {biro:b,peserta:j,setoran:S}=DATA,w=/^#[0-9a-f]{6}$/i.test(b.warna||'')?b.warna:'#0d5b4c',r=document.documentElement.style;r.setProperty('--green',w);r.setProperty('--deep',dark(w,.62));document.title='Tabungan '+j.n+' — '+b.biro;
  const okS=S.filter(x=>x.st=='ok'&&!x.void),pend=S.filter(x=>x.st!='ok'&&!x.void),paid=okS.reduce((a,x)=>a+x.v,0),pendSum=pend.reduce((a,x)=>a+x.v,0),harga=+j.harga||0,sisa=Math.max(0,harga-paid),pc=harga?Math.min(100,paid/harga*100):0;
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=iso(d).slice(0,7);ms.push({l:d.toLocaleDateString('id-ID',{month:'short'}),v:okS.filter(x=>x.tgl.startsWith(k)).reduce((a,x)=>a+x.v,0)})}
  const mx=Math.max(1,...ms.map(x=>x.v)),avg=ms.slice(-3).reduce((a,x)=>a+x.v,0)/3;
  let est='-';if(sisa==0&&harga)est='Lunas 🎉';else if(avg>0){const n=Math.ceil(sisa/avg),d=new Date();d.setMonth(d.getMonth()+n);est=d.toLocaleDateString('id-ID',{month:'short',year:'numeric'})}
  const R=56,C=2*Math.PI*R,stg=[[0,'🌙','Mulai'],[25,'🌱','25%'],[50,'✨','50%'],[75,'🏝️','75%'],[100,'✈️','Lunas']];
  const DEF='<svg viewBox="0 0 24 24" fill="#f0cf8a" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/></svg>',FOTO=/^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(DATA.foto_mini||'')?`<img src="${DATA.foto_mini}" alt="Foto ${esc(j.n)}">`:DEF;
  const stp=stg.map(x=>`<div class="st ${pc>=x[0]&&(x[0]>0||paid>0||true)&&pc>=x[0]?'on':''}"><i>${x[1]}</i>${x[2]}</div>`).join('');
  const tl=S.filter(x=>!x.void).slice(0,12).map(x=>`<li><span class="d">${esc(fd(x.tgl).split(' ')[0])}</span><span><b>${rp(x.v)}</b><small>${fd(x.tgl)} · ${esc(x.m)}</small></span><span class="r"><span class="tag ${x.st=='ok'?'':'p'}">${x.st=='ok'?'Terkonfirmasi':'Menunggu konfirmasi'}</span></span></li>`).join('')||'<div class="empty">Belum ada setoran.</div>';
  $('#app').innerHTML=`<div class="top"><div class="logo">${/^https?:/.test(b.logo||'')?`<img src="${esc(b.logo)}" alt="">`:esc(b.logo||String(b.biro||'?')[0])}</div><div><b>${esc(b.biro)}</b><small>${esc(b.tag||'')}</small></div></div>
<section class="hero"><div><div class="pid"><div class="pf">${FOTO}</div><div><div class="eb">Halo, selamat datang</div><h1>${esc(j.n)}</h1></div></div><p>Semoga persiapan perjalanan Anda lancar. Berikut perkembangan tabungan wisata Anda.</p><span class="chip">${esc(j.paket||'Paket belum dipilih')}${j.berangkat?' · Berangkat '+esc(fb(j.berangkat)):''}</span><span class="stp ${harga>0&&sisa==0?'l':'n'}">${harga>0&&sisa==0?'✓ LUNAS':'BELUM LUNAS'}</span></div>
<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="#ffffff22" stroke-width="9"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="#e7bd71" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/></svg><div><b>${pc.toFixed(0)}%</b><small>Tercapai</small></div></div></section>
<section class="grid3"><div class="k"><small>Sudah ditabung</small><b>${sh(paid)}</b></div><div class="k"><small>Sisa pelunasan</small><b>${sh(sisa)}</b></div><div class="k"><small>Perkiraan lunas</small><b style="font-size:17px">${est}</b></div></section>${dueCard()}
${pend.length?`<div class="ok" style="background:#fff7e6;color:#7d5a14;margin-top:14px">◷ ${pend.length} setoran (${rp(pendSum)}) sedang menunggu konfirmasi admin.</div>`:''}
<section class="card"><h2>Perjalanan menuju hari keberangkatan</h2><p class="sub">Dari total biaya paket ${rp(harga)}</p><div class="track"><div class="fill" style="width:calc((100% - 44px)*${pc/100})"></div>${stp}</div></section>
${sisa>0?`<section class="card" id="plan"><h2>Rencana pembayaran</h2><p class="sub">Pilih cara bayar yang paling nyaman. Ini hanya simulasi, Anda bebas membayar kapan saja.</p><div class="tabs">${[['lunas','Lunas sekarang'],['dua','2 kali'],['bulan','Cicilan bulanan'],['mampu','Sesuai kemampuan']].map(x=>`<button type="button" class="tab ${PLAN.mode==x[0]?'on':''}" data-m="${x[0]}">${x[1]}</button>`).join('')}</div><div id="pc"></div><div id="pr"></div></section>`:`<section class="card"><h2>tabungan lunas 🎉</h2><p class="sub">Seluruh biaya paket sudah terpenuhi. Pantau info keberangkatan dari admin travel.</p></section>`}
<section class="card"><h2>Tabungan per bulan</h2><p class="sub">Setoran terkonfirmasi, 6 bulan terakhir</p><div class="bars">${ms.map(x=>`<div class="bc"><i>${x.v?sh(x.v).replace('Rp ',''):''}</i><div class="bar" style="height:${x.v/mx*78}%;${x.v?'':'opacity:.25'}"></div>${x.l}</div>`).join('')}</div></section>
<section class="card"><h2>Kirim bukti transfer</h2><p class="sub">Transfer ke rekening berikut, lalu unggah buktinya di bawah.</p>
${b.rek?`<div class="rek"><span id="rk" style="flex:1">${esc(b.rek)}</span><button class="sec" id="cp">Salin</button></div>`:'<div class="empty">Rekening belum diatur oleh travel.</div>'}
<form id="f" style="margin-top:16px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px"><label>Nominal (Rp)<input name="v" type="number" inputmode="numeric" min="1" required></label><label>Tanggal transfer<input name="tgl" type="date" value="${iso(new Date())}" max="${iso(new Date())}" required></label></div><label>Metode<select name="m">${METODE.map(m=>`<option>${m}</option>`).join('')}</select></label><label>Foto bukti transfer<input name="foto" type="file" accept="image/*" required></label><button class="btn" id="sb">Kirim bukti transfer</button><div id="fm"></div></form>
${b.wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${wal(b.wa)}?text=${encodeURIComponent('Halo, saya '+j.n+' ('+j.id+') ingin bertanya tentang tabungan wisata.')}">Ada pertanyaan? Hubungi admin lewat WhatsApp →</a>`:''}</section>
${ledger(S,j,paid)}`;
  planInit();const cp=$('#cp');if(cp)cp.onclick=()=>{navigator.clipboard?.writeText($('#rk').textContent).then(()=>{cp.textContent='Tersalin ✓';setTimeout(()=>cp.textContent='Salin',2000)})};
  $('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),fm=$('#fm'),sb=$('#sb'),file=f.get('foto');sb.disabled=true;sb.textContent='Mengirim…';fm.innerHTML='';
    let path='',up=false;try{const blob=await shrink(file,1400);path=b.id+'/'+j.id+'-'+Date.now()+'.jpg';const u=await SB.storage.from('bukti-tf').upload(path,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;up=true;
      const r=await SB.rpc('peserta_kirim',{p_token:TK,p_v:+f.get('v'),p_tgl:f.get('tgl'),p_m:f.get('m'),p_bukti:path});if(r.error)throw r.error;
      await load();const m=$('#fm');if(m)m.innerHTML='<div class="ok">✓ Bukti transfer terkirim dan menunggu konfirmasi admin.</div>';$('#fm')?.scrollIntoView({behavior:'smooth',block:'center'})}
    catch(x){if(up)SB.storage.from('bukti-tf').remove([path]);fm.innerHTML='<div class="err">'+esc(x.message||'Gagal mengirim, coba lagi.')+'</div>';sb.disabled=false;sb.textContent='Kirim bukti transfer'}}}

/* ===== Rencana pembayaran interaktif & buku tabungan ===== */
let PLAN={mode:'bulan',n:6,k:0};
const addM=(d,n)=>{const x=new Date(d),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x};
const mDiff=(a,b)=>(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
const D2=d=>fd(iso(d));
function calc(){const j=DATA.peserta,S=DATA.setoran,okS=S.filter(x=>x.st=='ok'&&!x.void).sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0),paid=okS.reduce((a,x)=>a+x.v,0),harga=+j.harga||0,today=new Date();today.setHours(0,0,0,0);
const dep=/^\d{4}-\d{2}-\d{2}$/.test(j.berangkat||'')?new Date(j.berangkat+'T00:00'):null,maxM=dep?Math.min(36,Math.max(1,mDiff(today,dep)+1)):12;return{okS,paid,harga,sisa:Math.max(0,harga-paid),today,dep,maxM}}
function plan(c){const m=PLAN.mode,s=c.sisa;let amts=[],dates=[];
const split=n=>{const e=Math.ceil(s/n/1000)*1000,a=[];let rest=s;for(let i=0;i<n;i++){const v=i==n-1?rest:Math.min(e,rest);a.push(v);rest-=v}return a};
if(m=='lunas'){amts=[s];dates=[c.today]}
else if(m=='dua'){amts=split(2);dates=[c.today,addM(c.today,Math.max(1,Math.floor(c.maxM/2)))]}
else if(m=='bulan'){const n=Math.min(PLAN.n,c.maxM);amts=split(n);dates=amts.map((_,i)=>addM(c.today,i))}
else{const k=+PLAN.k;if(k>0){const n=Math.min(120,Math.ceil(s/k));for(let i=0;i<n;i++)amts.push(i==n-1?s-k*(n-1):k);dates=amts.map((_,i)=>addM(c.today,i))}}
return amts.map((v,i)=>({v,d:dates[i]})).filter(x=>x.v>0)}
function chart(c,p){if(!c.harga)return'';const W=360,H=210,L=8,Rr=10,T=24,B=28,t0=new Date(c.okS.length?Math.min(new Date(c.okS[0].tgl+'T00:00').getTime(),c.today.getTime()):c.today.getTime());t0.setDate(t0.getDate()-14);
const ends=[c.today.getTime(),...(c.dep?[c.dep.getTime()]:[]),...(p.length?[p[p.length-1].d.getTime()]:[])],t1=new Date(Math.max(...ends));t1.setDate(t1.getDate()+20);
const X=d=>L+(d-t0)/(t1-t0)*(W-L-Rr),Y=v=>T+(1-Math.min(1,v/c.harga))*(H-T-B),base=Y(0);
let cum=0;const h=[[t0,0]];c.okS.forEach(x=>{cum+=x.v;h.push([new Date(x.tgl+'T00:00'),cum])});h.push([c.today,cum]);
const f=[[c.today,cum]];let k=cum;p.forEach(x=>{k+=x.v;f.push([x.d,k])});
const pa=a=>a.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join(' ');
const tx=X(c.today),dx=c.dep?X(c.dep):null;
return `<svg class="cv" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik saldo tabungan dan rencana pembayaran"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--green)" stop-opacity=".28"/><stop offset="1" style="stop-color:var(--green)" stop-opacity="0"/></linearGradient></defs>
<line x1="${L}" x2="${W-Rr}" y1="${base}" y2="${base}" stroke="#dfe8e3"/><line x1="${L}" x2="${W-Rr}" y1="${T}" y2="${T}" stroke="#d9a84e" stroke-dasharray="4 4"/><text x="${L+2}" y="${T-7}" font-size="9" fill="#a87521">Target ${sh(c.harga)}</text>
<path d="${pa(h)} L${tx.toFixed(1)},${base} L${X(t0).toFixed(1)},${base}Z" fill="url(#gg)"/><path d="${pa(h)}" fill="none" style="stroke:var(--green)" stroke-width="2.5" stroke-linejoin="round"/>
${p.length?`<path d="${pa(f)}" fill="none" stroke="#d9a84e" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>`+(p.length<=14?f.slice(1).map(q=>`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="3.2" fill="#fff" stroke="#d9a84e" stroke-width="2"/>`).join(''):''):''}
<line x1="${tx}" x2="${tx}" y1="${T}" y2="${base}" stroke="#9fb3ab" stroke-dasharray="2 3"/><text x="${tx}" y="${H-10}" font-size="9" fill="#6a7f77" text-anchor="middle">Hari ini</text>
${dx!==null?`<line x1="${dx}" x2="${dx}" y1="${T}" y2="${base}" style="stroke:var(--green)" stroke-dasharray="4 3"/><text x="${dx>W-70?dx-4:dx+4}" y="${T+12}" font-size="9" style="fill:var(--green)" font-weight="700" text-anchor="${dx>W-70?'end':'start'}">✈️ Berangkat</text><text x="${dx}" y="${H-10}" font-size="9" fill="#6a7f77" text-anchor="${dx>W-60?'end':'middle'}">${fd(iso(c.dep)).replace(/ \d{4}$/,'')}</text>`:''}
<circle cx="${tx}" cy="${Y(cum).toFixed(1)}" r="5" style="fill:var(--green)" stroke="#fff" stroke-width="2"/></svg>
<div class="lg"><span><i style="border-color:var(--green)"></i>Tabungan saya</span><span><i style="border-color:#d9a84e;border-top-style:dashed"></i>Rencana</span><span><i style="border-color:#d9a84e;border-top-width:1px"></i>Target</span></div>`}
function planCtl(){const c=calc(),el=$('#pc');if(!el)return;
if(PLAN.mode=='bulan'){PLAN.n=Math.max(1,Math.min(PLAN.n,c.maxM));el.innerHTML=c.maxM<2?`<div class="warn">Keberangkatan kurang dari sebulan lagi, sebaiknya bayar sekaligus.</div>`:`<div class="ctl"><div class="lb"><span>Dicicil selama</span><b id="nv">${PLAN.n} bulan</b></div><input type="range" id="sl" min="1" max="${c.maxM}" value="${PLAN.n}"></div>`;const sl=$('#sl');if(sl)sl.oninput=()=>{PLAN.n=+sl.value;$('#nv').textContent=PLAN.n+' bulan';planRes()}}
else if(PLAN.mode=='mampu'){el.innerHTML=`<div class="ctl"><label style="margin:0">Berapa yang sanggup dibayar setiap bulan? (Rp)<input id="kk" type="number" inputmode="numeric" min="0" value="${PLAN.k||''}" placeholder="contoh: 2000000"></label></div>`;$('#kk').oninput=e=>{PLAN.k=+e.target.value||0;planRes()}}
else el.innerHTML=''}
function planRes(){const c=calc(),p=plan(c),el=$('#pr');if(!el)return;
if(!p.length){el.innerHTML='<div class="empty">Masukkan nominal yang sanggup Anda bayar setiap bulan.</div>';return}
const last=p[p.length-1].d,late=c.dep&&last>c.dep,gap=c.dep?Math.round((c.dep-last)/864e5):0;
const verdict=late?`<div class="warn">⚠ Cicilan terakhir (${D2(last)}) melewati tanggal berangkat (${D2(c.dep)}). Pilih cicilan yang lebih sedikit atau nominal yang lebih besar.</div>`:`<div class="good">✓ Lunas pada ${D2(last)}${c.dep?`, <b>${gap>=60?Math.round(gap/30)+' bulan':gap+' hari'}</b> sebelum keberangkatan`:''}.</div>`;
const rows=p.slice(0,12).map((x,i)=>`<li><span class="d">${i+1}</span><span><b>${rp(x.v)}</b><small>${x.d.getTime()==c.today.getTime()?'Hari ini':D2(x.d)}</small></span><button type="button" class="sec" data-pay="${x.v}">Bayar</button></li>`).join('');
el.innerHTML=`<div class="sum"><div><small>Jumlah bayar</small><b>${p.length}×</b></div><div><small>Per pembayaran</small><b>${sh(p[0].v)}</b></div><div><small>Total sisa</small><b>${sh(c.sisa)}</b></div></div>${verdict}${chart(c,p)}<ul class="tl">${rows}</ul>${p.length>12?`<div class="empty" style="padding:8px">+ ${p.length-12} pembayaran lainnya</div>`:''}`;
el.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const i=document.querySelector('#f [name=v]');i.value=b.dataset.pay;document.querySelector('#f').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>i.focus(),400)})}
function planInit(){const el=$('#plan');if(!el)return;el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{PLAN.mode=b.dataset.m;el.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));planCtl();planRes()});planCtl();planRes()}
function ledger(S,j,paid){let cum=0;const a=S.filter(x=>!x.void).slice().sort((x,y)=>x.tgl<y.tgl?-1:x.tgl>y.tgl?1:0).map(x=>{if(x.st=='ok')cum+=x.v;return{x,s:x.st=='ok'?cum:null}}).reverse().slice(0,15);
return `<section class="card"><h2>Rekening tabungan saya</h2><p class="sub">No. rekening tabungan: ${esc(j.id)}</p><div class="saldo"><small>Saldo terkonfirmasi</small><b>${rp(paid)}</b></div>${a.length?`<div class="tablewrap"><table class="bk"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Masuk</th><th>Saldo</th></tr></thead><tbody>${a.map(o=>`<tr><td>${fd(o.x.tgl)}</td><td>${esc(o.x.m)}${o.s===null?'<small style="color:#a87521">Menunggu konfirmasi</small>':''}</td><td class="n" ${o.s===null?'style="color:#a87521"':''}>+${rp(o.x.v)}</td><td class="n">${o.s===null?'—':rp(o.s)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada setoran.</div>'}</section>`}


function dueCard(){const c=calc();if(c.sisa<=0||!c.harga)return'';const dL=c.dep?Math.round((c.dep-c.today)/864e5):null,mL=c.dep?Math.max(0,mDiff(c.today,c.dep)):null,need=c.dep?(mL>0?Math.ceil(c.sisa/mL/1000)*1000:c.sisa):null,hot=dL!==null&&dL<=60;
return `<section class="due ${hot?'hot':''}"><div><small>Sisa yang perlu dilunasi</small><b>${rp(c.sisa)}</b><em>dari total ${rp(c.harga)}</em></div><div class="dr">${c.dep?`<div><small>Keberangkatan</small><b>${D2(c.dep)}</b><em>${dL<0?'Tanggal sudah lewat':dL==0?'Hari ini':'H-'+dL+' hari lagi'}</em></div><div><small>Disarankan per bulan</small><b>${rp(need)}</b><em>${mL>0?'selama '+mL+' bulan':'sebaiknya segera dilunasi'}</em></div>`:`<div style="grid-column:1/-1"><small>Tanggal keberangkatan</small><b style="font-size:17px">Belum ditentukan</b><em>Hubungi admin travel untuk informasinya</em></div>`}</div></section>`}

load();
</script>
